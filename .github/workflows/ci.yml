name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Garde anti-secret
        run: |
          test ! -f local.properties
          if git grep -nEi 'sk-[A-Za-z0-9]{8,}|sk_[A-Za-z0-9]{8,}|ghp_[A-Za-z0-9]{8,}' -- ':!*.md' ':!.github' ':!docs'; then
            echo 'secret suspect versionne (voir lignes ci-dessus)'
            exit 1
          fi

      - name: Limites de taille
        run: python3 tools/check-limits.py

      - name: Cette PR touche-t-elle du code ?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')
          else
            FILES=$(gh api "repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }}" --jq '.files[].filename' 2>/dev/null || git show --name-only --pretty=format: HEAD)
          fi
          echo "$FILES"
          if echo "$FILES" | grep -Eq '\.(kt|kts|py|js|ts|tsx|jsx|ps1|sh|gradle)$|^tools/|^.github/workflows/'; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build/test Node
        if: steps.scope.outputs.has_code == 'true' && hashFiles('package.json') != ''
        run: |
          npm ci || npm install
          npm test --if-present
          npm run build --if-present

      - name: Build/test Python
        if: steps.scope.outputs.has_code == 'true' && hashFiles('requirements.txt', 'pyproject.toml') != ''
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if python3 -c "import pytest" 2>/dev/null; then python3 -m pytest -q; else echo 'pytest absent, pas de tests'; fi
